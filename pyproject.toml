[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rehearsal-twin"
version = "0.1.0"
description = "Run a risky script on a disposable twin of your server first, then approve the exact ledger."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
